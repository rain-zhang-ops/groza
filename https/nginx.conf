worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    client_max_body_size 20m;

    # HTTP -> HTTPS(5036)   80 在国内时通时断，仅作跳转
    server {
        listen 80;
        listen [::]:80;
        server_name loomweave.cn www.loomweave.cn;
        return 301 https://$host:5036$request_uri;
    }

    # HTTPS：主用非标端口 5036（绕过 80/443 的未备案域名过滤）；443 保留备用
    server {
        listen 5036 ssl;
        listen [::]:5036 ssl;
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name loomweave.cn www.loomweave.cn;

        ssl_certificate     /etc/nginx/certs/loomweave.cn.pem;
        ssl_certificate_key /etc/nginx/certs/loomweave.cn.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # 哈希资源（含 builds/meta/<buildId>.json）：内容寻址，可放心缓存
        location ^~ /_nuxt/ {
            proxy_pass http://127.0.0.1:5037;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # 入口 HTML / 其余：禁止缓存，避免重建后仍用旧 buildId 导致
        # "Error creating app manifest matcher."
        location / {
            proxy_pass http://127.0.0.1:5037;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }
    }
}
